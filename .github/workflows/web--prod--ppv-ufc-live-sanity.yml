name: "Web · Prod · UFC PPV live · Canada · Sanity"
run-name: "Web · Prod · UFC PPV live · CA · Sanity · ${{ inputs.PPV_CONFIG }}"

on:
  workflow_dispatch:
    inputs:
      PPV_CONFIG:
        description: "UFC PPV JSON filename (for example: ppv_t_ufc_330.json)"
        required: true
        type: string
      BANNERS_CONFIGURED:
        description: "Banners Configured/Available"
        required: true
        type: choice
        default: "all"
        options: ["all", "true", "false"]

permissions:
  contents: read
  actions: write

env:
  JIRA_REGION: CA
  JIRA_REGION_FIELD_NAME: Region
  JIRA_DAZN_ENVIRONMENT_FIELD_NAME: DAZN Environment
  JIRA_PLATFORM_FIELD_NAME: Platform - required
  JIRA_DAZN_ENVIRONMENT: Live Prod
  JIRA_PLATFORM: Desktop Web
  JIRA_BASE_URL: https://livesport.atlassian.net
  JIRA_PROJECT_KEY: QAR
  JIRA_ISSUE_TYPE: Bug
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

jobs:
  prepare:
    name: Validate UFC PPV and build CA sanity matrix
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    outputs:
      new_matrix: ${{ steps.matrix.outputs.new_matrix }}
      signin_matrix: ${{ steps.matrix.outputs.signin_matrix }}
      signed_matrix: ${{ steps.matrix.outputs.signed_matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        shell: bash
        env:
          BANNERS_CONFIGURED: ${{ inputs.BANNERS_CONFIGURED }}
        run: |
          set -euo pipefail
          for mode in web-sanity-new web-sanity-signin web-sanity-signed; do
            output_file="$(mktemp)"
            GITHUB_OUTPUT="$output_file" node scripts/buildPpvWorkflowMatrix.js "$mode" '${{ inputs.PPV_CONFIG }}' 'CA'
            case "$mode" in
              web-sanity-new) key=new_matrix ;;
              web-sanity-signin) key=signin_matrix ;;
              web-sanity-signed) key=signed_matrix ;;
            esac
            sed "s/^matrix=/$key=/" "$output_file" >> "$GITHUB_OUTPUT"
            rm "$output_file"
          done

  new-user:
    needs: prepare
    environment: prod
    name: New user | ${{ matrix.source }} | ${{ matrix.plan }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.new_matrix) }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
      CI: 'true'
      HEADLESS: 'true'
      DAZN_ENV: prod
      DAZN_REGION: CA
      PPV_CONFIG: ${{ inputs.PPV_CONFIG }}
      SOURCE: ${{ matrix.source }}
      PLAN: ${{ matrix.plan }}
      LOGIN_FIRST: 'false'
      DEV_MODE_ON: 'off'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ppv-generic-runner
        with: { journey: new-user }

  sign-in-during-flow:
    needs: prepare
    environment: prod
    name: Existing user · Sign in during flow | ${{ matrix.source }} | ${{ matrix.profile }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.signin_matrix) }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
      CI: 'true'
      HEADLESS: 'true'
      DAZN_ENV: prod
      DAZN_REGION: CA
      PPV_CONFIG: ${{ inputs.PPV_CONFIG }}
      SOURCE: ${{ matrix.source }}
      PROFILE: ${{ matrix.profile }}
      LOGIN_FIRST: 'false'
      DEV_MODE_ON: 'off'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ppv-generic-runner
        with: { journey: sign-in-during-flow }

  already-signed-in:
    needs: prepare
    environment: prod
    name: Existing user · Already signed in | ${{ matrix.source }} | ${{ matrix.profile }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.signed_matrix) }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
      CI: 'true'
      HEADLESS: 'true'
      DAZN_ENV: prod
      DAZN_REGION: CA
      PPV_CONFIG: ${{ inputs.PPV_CONFIG }}
      SOURCE: ${{ matrix.source }}
      PROFILE: ${{ matrix.profile }}
      LOGIN_FIRST: 'true'
      DEV_MODE_ON: 'off'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ppv-generic-runner
        with: { journey: already-signed-in }

  workflow-summary:
    needs: [prepare, new-user, sign-in-during-flow, already-signed-in]
    if: ${{ always() }}
    name: Consolidated workflow report · CA
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ppv-workflow-summary
        with:
          title: Web UFC PPV live sanity workflow report · CA
          ppv_config: ${{ inputs.PPV_CONFIG }}
          country: CA
          artifact_pattern: ppv-web-*-attempt-${{ github.run_attempt }}
          artifact_name: ppv-web-CA-ufc-sanity-workflow-summary-${{ github.run_attempt }}
          new_user_status: ${{ needs.new-user.result }}
          sign_in_status: ${{ needs.sign-in-during-flow.result }}
          signed_in_status: ${{ needs.already-signed-in.result }}
